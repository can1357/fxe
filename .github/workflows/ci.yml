name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Add node_modules/.bin to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: extractions/setup-just@v2
      - name: Install lint/format toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck pipx
          pipx install --global clang-format==22.1.4
      - run: just ci-quick

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb pkg-config autoconf automake libtool \
            libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y pkgconfiglite

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap in-tree vcpkg
        shell: bash
        run: |
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFXE_FETCH_DEPS=ON \
            -DFXE_ENABLE_WGPU=OFF \
            -DFXE_ENABLE_V8=OFF \
            -DFXE_ENABLE_NODE_COMPAT=OFF \
            -DGLFW_BUILD_WAYLAND=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$pwd/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DFXE_FETCH_DEPS=ON `
            -DFXE_ENABLE_WGPU=OFF `
            -DFXE_ENABLE_V8=OFF `
            -DFXE_ENABLE_NODE_COMPAT=OFF
        env:
          CC: cl
          CXX: cl

      - name: Build core tests and examples
        run: cmake --build build --config Release --target fxe_core_tests hello_triangle hello_sprite primitives_showcase

      - name: Test core and example smoke targets
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure -R '^(fxe_core_tests|fxe_example_)'
          else
            ctest --test-dir build -C Release --output-on-failure -R '^(fxe_core_tests|fxe_example_)'
          fi
